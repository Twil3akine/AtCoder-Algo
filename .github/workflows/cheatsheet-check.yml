name: Check cheatsheet Rustdoc

on:
  pull_request:
    paths:
      - 'src/lib.rs'
      - 'src/lib/cheatsheet/**'
      - 'docs/cheatsheet/**'
      - '.github/workflows/cheatsheet-check.yml'

jobs:
  rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: rustfmt --check src/lib.rs src/lib/cheatsheet/mod.rs
      - name: Build Rustdoc and validate links
        run: RUSTDOCFLAGS='-D rustdoc::broken_intra_doc_links' cargo doc --no-deps
      - name: Verify generated cheatsheet pages and search index
        run: |
          test -f target/doc/atcoder/cheatsheet/index.html
          test -f target/doc/atcoder/cheatsheet/tree/diameter_pairs/index.html
          test -f target/doc/atcoder/cheatsheet/graph/low_link/index.html
          # Rustdocの検索索引は圧縮形式です。日本語を生の文字列としてgrepできません。
          # alias用の検索索引と、対応する検索エイリアスの宣言を確認します。
          test -d target/doc/search.index/alias
          find target/doc/search.index/alias -type f -name '*.js' | grep -q .
          grep -qF '#[doc(alias = "最遠点")]' src/lib/cheatsheet/mod.rs
          grep -qF '#[doc(alias = "無料移動")]' src/lib/cheatsheet/mod.rs
