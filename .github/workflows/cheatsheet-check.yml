name: Check cheatsheet Rustdoc

on:
  pull_request:
    paths:
      - 'src/lib.rs'
      - 'src/lib/cheatsheet/**'
      - 'docs/cheatsheet/**'
      - '.github/workflows/cheatsheet-check.yml'

jobs:
  rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: rustfmt --check src/lib.rs src/lib/cheatsheet/mod.rs
      - name: Build Rustdoc and validate links
        run: RUSTDOCFLAGS='-D rustdoc::broken_intra_doc_links' cargo doc --no-deps
      - name: Verify generated cheatsheet pages and search aliases
        run: |
          test -f target/doc/atcoder/cheatsheet/index.html
          test -f target/doc/atcoder/cheatsheet/tree/diameter_pairs/index.html
          test -f target/doc/atcoder/cheatsheet/graph/low_link/index.html
          # rustdocの版により、検索索引はsearch.index/内の分割ファイルにもなります。
          if [ -d target/doc/search.index ]; then
            search_index=target/doc/search.index
          else
            search_index=target/doc/search-index.js
          fi
          if [ ! -e "$search_index" ]; then
            find target/doc -maxdepth 3 -type f -name '*search*' -print
            exit 1
          fi
          echo "Search index: $search_index"
          find "$search_index" -maxdepth 2 -type f -print | head -10
          first="$(find "$search_index" -type f | head -1)"
          if [ -n "$first" ]; then
            head -c 500 "$first"
            echo
          fi
          for alias in '最遠点' '無料移動'; do
            if grep -R -qF "$alias" "$search_index"; then
              echo "Indexed alias: $alias"
            else
              echo "::error::Missing search alias: $alias"
              exit 1
            fi
          done
