name: Check cheatsheet Rustdoc

on:
  pull_request:
    paths:
      - 'src/lib.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/cheatsheet/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/cheatsheet-check.yml'

jobs:
  rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: rustfmt --check src/lib.rs docs/cheatsheet/src/lib.rs
      - name: Build API and cheatsheet docs together, validate links
        run: RUSTDOCFLAGS='-D rustdoc::broken_intra_doc_links' cargo doc --locked --no-deps
      - name: Verify distinct Rustdoc pages and alias index
        run: |
          test -f target/doc/atcoder/index.html
          test -f target/doc/atcoder_cheatsheet/index.html
          test -f target/doc/atcoder_cheatsheet/tree/diameter_pairs/index.html
          test -f target/doc/atcoder_cheatsheet/graph/low_link/index.html
          test -f target/doc/atcoder_cheatsheet/data_structure/inversion_count/index.html
          test -f target/doc/atcoder_cheatsheet/array/compress/index.html
          test -f target/doc/atcoder_cheatsheet/string/palindrome/index.html
          test -f target/doc/atcoder_cheatsheet/math/combinatorics/index.html
          test -f target/doc/atcoder_cheatsheet/geometry/convex_hull/index.html
          test -f target/doc/atcoder_cheatsheet/utility/grid_neighbors/index.html
          test ! -e target/doc/atcoder/cheatsheet/index.html
          test -d target/doc/search.index/alias
          find target/doc/search.index/alias -type f -name '*.js' | grep -q .
          grep -qF '#[doc(alias = "最遠点")]' docs/cheatsheet/src/lib.rs
          grep -qF '#[doc(alias = "無料移動")]' docs/cheatsheet/src/lib.rs
          grep -qF '#[doc(alias = "転倒数")]' docs/cheatsheet/src/lib.rs
          grep -qF '#[doc(alias = "回文")]' docs/cheatsheet/src/lib.rs
          grep -qF '#[doc(alias = "素因数分解")]' docs/cheatsheet/src/lib.rs
          grep -qF '#[doc(alias = "凸包")]' docs/cheatsheet/src/lib.rs
      - name: Verify document tests and Bundler
        run: |
          cargo test --locked --doc
          cargo test --manifest-path tools/bundler/Cargo.toml
