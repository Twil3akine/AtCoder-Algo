name: Rust library checks

on:
  push:
    branches:
      - feat/advanced-algorithms-centroids-20261102
  pull_request:

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test library
        run: cargo test --all-targets
      - name: Test documentation
        run: cargo test --doc
      - name: Test bundler
        run: cargo test --manifest-path tools/bundler/Cargo.toml
