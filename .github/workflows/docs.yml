name: Deploy Rustdoc

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build API and cheatsheet Rustdoc in one command
        run: cargo doc --no-deps

      - name: Create a two-choice documentation entry
        run: |
          cat > target/doc/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>AtCoder-Algo ドキュメント</title>
          <style>
            body { max-width: 850px; margin: 10vh auto; padding: 0 24px; color: #202631; background: #f8fafc; font: 16px/1.7 system-ui, sans-serif; }
            h1 { font-size: 2rem; }
            .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin-top: 30px; }
            .links a { display: block; padding: 24px; border: 1px solid #d5dbe5; border-radius: 14px; background: #fff; color: inherit; text-decoration: none; }
            .links a:hover, .links a:focus-visible { border-color: #3875b8; outline-offset: 3px; }
            .links strong { display: block; font-size: 1.25rem; }
            .links span { color: #485466; }
          </style>
          <h1>AtCoder-Algo</h1>
          <p>探したい内容に合わせてドキュメントを選択してください。</p>
          <nav class="links" aria-label="ドキュメントの種類">
            <a href="atcoder_cheatsheet/index.html"><strong>解法チートシート</strong><span>こういう条件の問題では何を使う？ 問題の特徴から逆引き</span></a>
            <a href="atcoder/index.html"><strong>APIリファレンス</strong><span>関数・型・データ構造の仕様や使用例を探す</span></a>
          </nav>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/doc

      - name: Deploy
        uses: actions/deploy-pages@v4
